name: my-lab

services:
  loki:
    image: grafana/loki:3.7.1
    container_name: my-lab-loki
    restart: unless-stopped
    ports:
      - "8300:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml
      - loki_data:/loki
    command: ["-config.file=/etc/loki/config.yaml"]
    # grafana/loki is distroless — no shell available for healthcheck
    healthcheck:
      disable: true
    networks:
      - my-lab

  tempo:
    image: grafana/tempo:2.10.5
    container_name: my-lab-tempo
    restart: unless-stopped
    ports:
      - "8301:3200"
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo/config.yaml
      - tempo_data:/var/tempo/traces
    command: ["-config.file=/etc/tempo/config.yaml"]
    # grafana/tempo is distroless — no shell available for healthcheck
    healthcheck:
      disable: true
    networks:
      - my-lab

  prometheus:
    image: prom/prometheus:v3.11.2
    container_name: my-lab-prometheus
    restart: unless-stopped
    ports:
      - "8302:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - my-lab

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.1
    container_name: my-lab-otel-collector
    restart: unless-stopped
    ports:
      - "8304:4317"   # OTLP gRPC
      - "8305:4318"   # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
    # otel/opentelemetry-collector-contrib is distroless — no shell available
    healthcheck:
      disable: true
    networks:
      - my-lab

  grafana:
    image: grafana/grafana:11.6.0
    container_name: my-lab-grafana
    restart: unless-stopped
    env_file: ./observability.env
    ports:
      - "8303:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - my-lab

volumes:
  loki_data:
    name: my-lab_loki_data
  tempo_data:
    name: my-lab_tempo_data
  prometheus_data:
    name: my-lab_prometheus_data
  grafana_data:
    name: my-lab_grafana_data

networks:
  my-lab:
    external: true
    name: my-lab
